<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toletum Bike Life | Streetwear</title>
  <style id="dynamic-styles">
    :root {
      --bg: #090a0f;
      --panel: #12141d;
      --accent-blue: #00d2ff;
      --accent-pink: #ff0055;
      --text: #ffffff;
    }
  </style>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 50px; transition: background 0.3s; }
    
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      background: linear-gradient(180deg, rgba(18,20,29,0.9) 0%, var(--bg) 100%);
      border-bottom: 2px solid var(--accent-blue);
    }
    .logo-container img {
      max-width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 0 20px var(--accent-blue);
      margin-bottom: 15px;
    }
    h1 { font-size: 2.2rem; text-transform: uppercase; letter-spacing: 2px; text-shadow: 2px 2px var(--accent-pink); }
    p.subtitle { color: #aaa; margin-top: 5px; }

    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }

    .section-title {
      font-size: 1.5rem;
      margin: 40px 0 20px 0;
      text-transform: uppercase;
      border-left: 4px solid var(--accent-pink);
      padding-left: 10px;
    }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    
    .card {
      background: var(--panel);
      border: 1px solid #222;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card img { width: 100%; height: 220px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; }
    .card h3 { margin-bottom: 5px; }
    .price { font-size: 1.2rem; color: var(--accent-blue); font-weight: bold; margin-bottom: 15px; }
    
    .btn {
      background: linear-gradient(45deg, var(--accent-blue), var(--accent-pink));
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .tiktok-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
    .tiktok-card { width: 100%; max-width: 320px; height: 580px; background: #000; border-radius: 10px; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; }

    /* Modal de pedido */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
    .modal-content { background: var(--panel); padding: 25px; border-radius: 10px; max-width: 400px; width: 90%; border: 1px solid var(--accent-blue); }
    .modal-content input, .modal-content select { width: 100%; padding: 10px; margin: 8px 0; background: var(--bg); border: 1px solid #444; color: white; border-radius: 4px; }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <img id="site-logo" src="/logo-toletum.jpeg" alt="Logo" onerror="this.src='https://via.placeholder.com/180?text=TLT+BKLF'">
    </div>
    <h1 id="site-title">TOLETUM BIKE LIFE</h1>
    <p class="subtitle" id="site-subtitle">Streetwear & Urban Culture | Toledo</p>
  </header>

  <div class="container">
    <h2 class="section-title">Colección Ropa</h2>
    <div class="grid" id="products-container"></div>

    <h2 class="section-title">Vídeos Oficiales</h2>
    <div class="tiktok-grid" id="tiktok-container"></div>
  </div>

  <!-- Modal Pedido -->
  <div class="modal" id="orderModal">
    <div class="modal-content">
      <h3 id="orderItemTitle">Realizar Pedido</h3>
      <input type="text" id="custName" placeholder="Tu Nombre Completo">
      <input type="email" id="custEmail" placeholder="Tu Email">
      <input type="tel" id="custPhone" placeholder="Teléfono de contacto">
      <input type="text" id="custAddress" placeholder="Dirección Completa de Envío">
      <select id="deliveryType">
        <option value="Envío a Domicilio">Envío a Domicilio</option>
        <option value="Recogida Local (Toledo)">Recogida Local (Toledo)</option>
      </select>
      <button class="btn" onclick="submitOrder()">Confirmar Pedido</button>
      <button class="btn" style="background: #444; margin-top: 5px;" onclick="closeOrderModal()">Cancelar</button>
    </div>
  </div>

  <script>
    let selectedProduct = null;

    async function loadContent() {
      try {
        const res = await fetch('/api/content');
        const data = await res.json();

        // Aplicar Estilos Dinámicos
        const cfg = data.config;
        document.getElementById('dynamic-styles').innerHTML = `
          :root {
            --bg: ${cfg.bgColor};
            --panel: ${cfg.panelColor};
            --accent-blue: ${cfg.accentBlue};
            --accent-pink: ${cfg.accentPink};
            --text: ${cfg.textColor};
          }
        `;

        document.getElementById('site-title').innerText = cfg.storeTitle;
        document.getElementById('site-subtitle').innerText = cfg.subtitle;
        if(cfg.logoUrl) document.getElementById('site-logo').src = cfg.logoUrl;

        // Render Productos
        const prodContainer = document.getElementById('products-container');
        prodContainer.innerHTML = data.products.map(p => `
          <div class="card">
            <img src="${p.image}" alt="${p.name}">
            <h3>${p.name}</h3>
            <div class="price">${p.price}€</div>
            <button class="btn" onclick="openOrderModal('${p.name}', '${p.price}')">Hacer Pedido</button>
          </div>
        `).join('');

        // Render TikToks
        const ttContainer = document.getElementById('tiktok-container');
        ttContainer.innerHTML = data.tiktokEmbeds.map(url => `
          <div class="tiktok-card">
            <iframe src="${url}"></iframe>
          </div>
        `).join('');

      } catch (err) {
        console.error("Error cargando los datos:", err);
      }
    }

    function openOrderModal(name, price) {
      selectedProduct = { name, price };
      document.getElementById('orderItemTitle').innerText = `Pedir: ${name} (${price}€)`;
      document.getElementById('orderModal').style.display = 'flex';
    }

    function closeOrderModal() {
      document.getElementById('orderModal').style.display = 'none';
    }

    async function submitOrder() {
      const orderData = {
        customerName: document.getElementById('custName').value,
        email: document.getElementById('custEmail').value,
        phone: document.getElementById('custPhone').value,
        address: document.getElementById('custAddress').value,
        deliveryType: document.getElementById('deliveryType').value,
        items: `${selectedProduct.name} (${selectedProduct.price}€)`,
        total: `${selectedProduct.price}€`
      };

      const res = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(orderData)
      });

      if (res.ok) {
        alert("¡Pedido realizado con éxito! Te contactaremos pronto.");
        closeOrderModal();
      }
    }

    loadContent();
  </script>
</body>
</html>
