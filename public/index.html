<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toletum Bike Life | Streetwear</title>
  <style>
    :root {
      --bg: #090a0f;
      --panel: #12141d;
      --accent-blue: #00d2ff;
      --accent-pink: #ff0055;
      --text: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 50px; }
    
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      background: linear-gradient(180deg, rgba(18,20,29,0.9) 0%, rgba(9,10,15,1) 100%);
      border-bottom: 2px solid var(--accent-blue);
    }
    .logo-container img {
      max-width: 180px;
      height: auto;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
      margin-bottom: 15px;
    }
    h1 { font-size: 2.2rem; text-transform: uppercase; letter-spacing: 2px; text-shadow: 2px 2px var(--accent-pink); }
    p.subtitle { color: #aaa; margin-top: 5px; }

    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }

    .section-title {
      font-size: 1.5rem;
      margin: 40px 0 20px 0;
      text-transform: uppercase;
      border-left: 4px solid var(--accent-pink);
      padding-left: 10px;
    }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    
    .card {
      background: var(--panel);
      border: 1px solid #222;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-5px); border-color: var(--accent-blue); }
    .card h3 { margin-bottom: 10px; }
    .price { font-size: 1.2rem; color: var(--accent-blue); font-weight: bold; margin-bottom: 15px; }
    
    .btn {
      background: linear-gradient(45deg, var(--accent-blue), var(--accent-pink));
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }

    .tiktok-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
    .tiktok-card { width: 100%; max-width: 320px; height: 580px; background: #000; border-radius: 10px; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <img src="/logo-toletum.jpeg" alt="Toletum Bike Life Logo" onerror="this.src='https://via.placeholder.com/180?text=TLT+BKLF'">
    </div>
    <h1 id="site-title">TOLETUM BIKE LIFE</h1>
    <p class="subtitle" id="site-subtitle">Streetwear & Urban Culture | Toledo</p>
  </header>

  <div class="container">
    <h2 class="section-title">Colección Destacada</h2>
    <div class="grid" id="products-container"></div>

    <h2 class="section-title">Últimos Vídeos en TikTok</h2>
    <div class="tiktok-grid" id="tiktok-container"></div>
  </div>

  <script>
    async function loadContent() {
      try {
        const res = await fetch('/api/content');
        const data = await res.json();

        document.getElementById('site-title').innerText = data.storeTitle;
        document.getElementById('site-subtitle').innerText = data.subtitle;

        const prodContainer = document.getElementById('products-container');
        prodContainer.innerHTML = data.products.map(p => `
          <div class="card">
            <h3>${p.name}</h3>
            <div class="price">${p.price}</div>
            <button class="btn">Comprar</button>
          </div>
        `).join('');

        const ttContainer = document.getElementById('tiktok-container');
        ttContainer.innerHTML = data.tiktokEmbeds.map(url => `
          <div class="tiktok-card">
            <iframe src="${url}"></iframe>
          </div>
        `).join('');

      } catch (err) {
        console.error("Error al cargar datos:", err);
      }
    }

    loadContent();
  </script>
</body>
</html>
