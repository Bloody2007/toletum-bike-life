<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin | Toletum Bikelife</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0d0f17; color: white; padding: 20px; }
    .panel { max-width: 900px; margin: 0 auto; background: #161925; padding: 25px; border-radius: 10px; border: 1px solid #2d3248; }
    h1 { text-align: center; color: #00d2ff; margin-bottom: 20px; }
    
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .tab-btn { background: #090a0f; color: white; border: 1px solid #444; padding: 10px 15px; cursor: pointer; border-radius: 5px; font-weight: bold; }
    .tab-btn.active { background: #ff0055; border-color: #ff0055; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    label { display: block; margin-top: 12px; font-weight: bold; color: #00d2ff; }
    input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; background: #090a0f; border: 1px solid #3d4461; color: white; border-radius: 5px; }
    .color-picker { display: flex; gap: 10px; align-items: center; }
    .color-picker input[type="color"] { width: 50px; height: 40px; padding: 0; cursor: pointer; }

    .btn-main { margin-top: 20px; width: 100%; padding: 12px; background: linear-gradient(45deg, #00d2ff, #ff0055); color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; }

    .item-list { margin-top: 15px; }
    .item-card { background: #090a0f; padding: 12px; margin-bottom: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid #00d2ff; }
    .btn-del { background: #ff0055; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 3px; }

    .order-card { background: #090a0f; border: 1px solid #333; padding: 15px; border-radius: 6px; margin-bottom: 15px; line-height: 1.6; }
    .order-card header { display: flex; justify-content: space-between; border-bottom: 1px solid #222; padding-bottom: 8px; margin-bottom: 8px; color: #ff0055; }
  </style>
</head>
<body>

  <div class="panel">
    <h1>Panel de Control de la Web</h1>

    <label>Contraseña Administrador</label>
    <input type="password" id="password" value="admin123" placeholder="Clave admin">

    <div class="tabs" style="margin-top:20px;">
      <button class="tab-btn active" onclick="switchTab('tab-design', event)">Diseño y Apariencia</button>
      <button class="tab-btn" onclick="switchTab('tab-products', event)">Catálogo Ropa</button>
      <button class="tab-btn" onclick="switchTab('tab-orders', event)">Pedidos Recibidos</button>
    </div>

    <!-- PESTAÑA 1: DISEÑO Y APARIENCIA -->
    <div id="tab-design" class="tab-content active">
      <label>Título de la Web</label>
      <input type="text" id="storeTitle">

      <label>Subtítulo / Eslogan</label>
      <input type="text" id="subtitle">

      <label>Ruta/URL del Logo</label>
      <input type="text" id="logoUrl">

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div>
          <label>Color Fondo Principal</label>
          <div class="color-picker">
            <input type="color" id="bgColor" onchange="document.getElementById('bgColorTxt').value = this.value">
            <input type="text" id="bgColorTxt">
          </div>
        </div>
        <div>
          <label>Color Tarjetas/Paneles</label>
          <div class="color-picker">
            <input type="color" id="panelColor" onchange="document.getElementById('panelColorTxt').value = this.value">
            <input type="text" id="panelColorTxt">
          </div>
        </div>
        <div>
          <label>Acento Azul</label>
          <div class="color-picker">
            <input type="color" id="accentBlue" onchange="document.getElementById('accentBlueTxt').value = this.value">
            <input type="text" id="accentBlueTxt">
          </div>
        </div>
        <div>
          <label>Acento Rosa</label>
          <div class="color-picker">
            <input type="color" id="accentPink" onchange="document.getElementById('accentPinkTxt').value = this.value">
            <input type="text" id="accentPinkTxt">
          </div>
        </div>
      </div>

      <label>Vídeos Embed de TikTok (separados por coma)</label>
      <textarea id="tiktokEmbeds" rows="3"></textarea>

      <button class="btn-main" onclick="saveDesign()">Guardar Cambios de Estética</button>
    </div>

    <!-- PESTAÑA 2: PRODUCTOS -->
    <div id="tab-products" class="tab-content">
      <h3>Añadir Producto al Catálogo</h3>
      <input type="text" id="prodName" placeholder="Nombre (ej: Camiseta Oversized Bikelife)">
      <input type="text" id="prodPrice" placeholder="Precio (ej: 29.99)">
      <input type="text" id="prodImage" placeholder="URL de la imagen del producto">
      <button class="btn-main" onclick="addProduct()">Añadir Producto</button>

      <h3 style="margin-top: 30px;">Productos Activos</h3>
      <div id="products-list" class="item-list"></div>
    </div>

    <!-- PESTAÑA 3: PEDIDOS -->
    <div id="tab-orders" class="tab-content">
      <h3>Lista de Pedidos</h3>
      <div id="orders-list" style="margin-top: 15px;"></div>
    </div>

    <div id="status" style="margin-top: 15px; text-align: center; font-weight: bold;"></div>
  </div>

  <script>
    function switchTab(tabId, ev) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      ev.target.classList.add('active');
    }

    async function loadData() {
      const res = await fetch('/api/content');
      const data = await res.json();

      const cfg = data.config;
      document.getElementById('storeTitle').value = cfg.storeTitle;
      document.getElementById('subtitle').value = cfg.subtitle;
      document.getElementById('logoUrl').value = cfg.logoUrl || '/logo-toletum.jpeg';

      document.getElementById('bgColor').value = cfg.bgColor;
      document.getElementById('bgColorTxt').value = cfg.bgColor;
      document.getElementById('panelColor').value = cfg.panelColor;
      document.getElementById('panelColorTxt').value = cfg.panelColor;
      document.getElementById('accentBlue').value = cfg.accentBlue;
      document.getElementById('accentBlueTxt').value = cfg.accentBlue;
      document.getElementById('accentPink').value = cfg.accentPink;
      document.getElementById('accentPinkTxt').value = cfg.accentPink;

      document.getElementById('tiktokEmbeds').value = data.tiktokEmbeds.join(', ');

      // Lista de productos
      const prodList = document.getElementById('products-list');
      prodList.innerHTML = data.products.map(p => `
        <div class="item-card">
          <div><strong>${p.name}</strong> - ${p.price}€</div>
          <button class="btn-del" onclick="deleteProduct(${p.id})">Eliminar</button>
        </div>
      `).join('');

      // Lista de pedidos
      const ordList = document.getElementById('orders-list');
      if(data.orders.length === 0) {
        ordList.innerHTML = "<p style='color:#888;'>No hay pedidos registrados.</p>";
      } else {
        ordList.innerHTML = data.orders.map(o => `
          <div class="order-card">
            <header>
              <span><strong>Pedido #${o.id}</strong> - ${o.date}</span>
              <span><strong>Total: ${o.total}</strong></span>
            </header>
            <div><strong>Cliente:</strong> ${o.customerName}</div>
            <div><strong>Contacto:</strong> ${o.email} | ${o.phone}</div>
            <div><strong>Dirección:</strong> ${o.address} (${o.deliveryType})</div>
            <div><strong>Items:</strong> ${o.items}</div>
          </div>
        `).join('');
      }
    }

    async function saveDesign() {
      const password = document.getElementById('password').value;
      const config = {
        storeTitle: document.getElementById('storeTitle').value,
        subtitle: document.getElementById('subtitle').value,
        logoUrl: document.getElementById('logoUrl').value,
        bgColor: document.getElementById('bgColorTxt').value,
        panelColor: document.getElementById('panelColorTxt').value,
        accentBlue: document.getElementById('accentBlueTxt').value,
        accentPink: document.getElementById('accentPinkTxt').value
      };
      const tiktokEmbeds = document.getElementById('tiktokEmbeds').value.split(',').map(s => s.trim());

      const res = await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password, config, tiktokEmbeds })
      });

      showStatus(res);
    }

    async function addProduct() {
      const password = document.getElementById('password').value;
      const product = {
        name: document.getElementById('prodName').value,
        price: document.getElementById('prodPrice').value,
        image: document.getElementById('prodImage').value || 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500'
      };

      const res = await fetch('/api/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password, product })
      });

      showStatus(res);
    }

    async function deleteProduct(id) {
      const password = document.getElementById('password').value;
      const res = await fetch(`/api/products/${id}`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });

      showStatus(res);
    }

    async function showStatus(res) {
      const status = document.getElementById('status');
      const data = await res.json();
      if(res.ok) {
        status.style.color = '#00ff88';
        status.innerText = data.message;
        loadData();
      } else {
        status.style.color = '#ff0055';
        status.innerText = data.error || 'Error al guardar';
      }
    }

    loadData();
  </script>
</body>
</html>
